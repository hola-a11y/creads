name: FTP pull once

# Workflow temporal de un solo uso: al hacer push se ejecuta y descarga el
# sitio de graduación del servidor al repo (carpeta graduacion/). Se borra
# después de la primera ejecución.

on:
  push:
    branches: [claude/quirky-johnson-8apw3n]
    paths:
      - ".github/workflows/ftp-pull-once.yml"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      REMOTE_DIR: "/"
      LOCAL_DIR: graduacion
      INCLUDES: "--include-glob=*.html --include-glob=*.htm --include-glob=*.css --include-glob=*.js --include-glob=*.jpg --include-glob=*.jpeg --include-glob=*.png --include-glob=*.webp --include-glob=*.gif --include-glob=*.svg --include-glob=*.ico --include-glob=*.woff --include-glob=*.woff2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Pull (servidor -> repo)
        run: |
          mkdir -p "$LOCAL_DIR"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:ssl-allow true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 2; set net:timeout 25; mirror --verbose --no-perms $INCLUDES \"$REMOTE_DIR\" \"$LOCAL_DIR\"; bye"
          echo "Archivos descargados:" && find "$LOCAL_DIR" -type f | sort

      - name: Commit pulled files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOCAL_DIR"
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "chore: descarga inicial del sitio de graduación desde FTP"
            git push origin HEAD:${{ github.ref_name }}
          fi
